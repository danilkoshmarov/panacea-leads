name: Collect public Telegram leads
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/leads.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-lead-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public channel posts
        run: python scripts/collect_telegram.py
      - name: Commit updated lead feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet || (git commit -m "chore: refresh Telegram lead feed" && git push)
